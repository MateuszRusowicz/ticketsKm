name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: km
          POSTGRES_PASSWORD: km
          POSTGRES_DB: km_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the local toolchain. A version skew between here and a
          # developer's machine is exactly the "passes on my laptop" problem
          # the test suite exists to prevent.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://km:km@localhost:5432/km_test
          DIRECT_URL: postgresql://km:km@localhost:5432/km_test
          SESSION_SECRET: ci_secret_at_least_32_characters_long_ok
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
