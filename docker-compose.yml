services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: km
      POSTGRES_PASSWORD: km
      POSTGRES_DB: km_dev
    ports:
      - '5432:5432'
    volumes:
      - km_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U km -d km_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  km_pgdata:
